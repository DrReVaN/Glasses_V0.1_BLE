name: Firmware build and regression tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Host regression tests with memory sanitizers
        run: |
          python3 tools/test.py --cc gcc --sanitize
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install pinned Arm GNU Toolchain 13.2.Rel1
        run: |
          curl -fL --retry 3 https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-arm-none-eabi.tar.xz -o /tmp/arm.tar.xz
          mkdir -p /tmp/arm
          tar -xf /tmp/arm.tar.xz -C /tmp/arm --strip-components=1
      - name: Build and validate both images
        run: |
          python3 tools/build.py --toolchain-bin /tmp/arm/bin
          python3 tools/package.py
          python3 tools/ota.py build/application/smartglasses.bin --check
          python3 tools/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: smartglasses-stm32wb35-cpu1
          path: |
            build/*/smartglasses.bin
            build/*/smartglasses.hex
            build/*/smartglasses.elf
            build/*/smartglasses.map
            build/*/smartglasses.json
            build/install.hex
            build/metadata.bin
      - uses: actions/upload-artifact@v4
        with:
          name: verified-firmware-releases
          path: build/releases/
  publish:
    needs: firmware
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev/firmware-fixes-ota'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: smartglasses-firmware-releases
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-firmware-releases
          path: build/releases
      - name: Publish complete verified development releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/release.py --publish
